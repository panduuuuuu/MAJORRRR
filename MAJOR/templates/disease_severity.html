<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disease Severity</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 20px;
            color: #00796b;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .form-block {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            padding: 25px;
            margin: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .form-block:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
        }
        label {
            font-weight: bold;
            color: #00796b;
        }
        input, select, button {
            margin: 5px 0;
            font-size: 1.1rem;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button {
            background-color: #0288d1;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #01579b;
            transform: translateY(-3px);
        }
        .result-block {
            margin-top: 20px;
            background-color: #b2ebf2;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #80deea;
            color: #004d40;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .result-block:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
        }
        .chart-block {
            text-align: center;
            margin-top: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Disease Severity Analysis</h1>
        <div class="form-block">
            <form action="/disease_severity" method="post">
                <label for="age">Enter Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter your age" required>
                <label for="symptoms">Select Symptoms:</label>
                <select id="symptoms" name="symptoms" multiple>
                    {% for symptom in symptoms %}
                        <option value="{{ symptom }}">{{ symptom }}</option>
                    {% endfor %}
                </select>
                <button type="submit">Analyze</button>
            </form>
        </div>
        {% if severity %}
        <div class="result-block">
            <h3>Severity Result:</h3>
            <p>Age: {{ age }}</p>
            <p>Severity Level: {{ severity }}</p>
            <p>Severity Score: {{ severity_score }}</p>
            <div class="chart-block">
                <h4>Severity Visualization:</h4>
                <img src="{{ severity_visualization }}" alt="Severity Chart">
            </div>
            <h4>Suggested Actions:</h4>
            <p>{{ suggested_actions }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
